<html lang="ja">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F2EF;--panel:#FBFBF9;--ink:#191C25;--mute:#6A6F7C;--line:#D9DBD5;--accent:#2446C8;--accent-ink:#fff;--mark:#FFE25A;--ok:#1E8E5A;--ng:#C23B3B;--gold:#B8860B;--bright:1;--gx:max(16px,env(safe-area-inset-left));--gr:max(16px,env(safe-area-inset-right))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14161C;--panel:#1D2029;--ink:#ECEDF1;--mute:#9AA0AE;--line:#2D313D;--accent:#7F9BFF;--accent-ink:#10131C;--mark:#E8C93A;--ok:#4FCB8E;--ng:#F07B7B;--gold:#E3B341;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14161C;--panel:#1D2029;--ink:#ECEDF1;--mute:#9AA0AE;--line:#2D313D;--accent:#7F9BFF;--accent-ink:#10131C;--mark:#E8C93A;--ok:#4FCB8E;--ng:#F07B7B;--gold:#E3B341;color-scheme:dark}
*{box-sizing:border-box}
html{filter:brightness(var(--bright))}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Zen Kaku Gothic New",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.small{font-size:12.5px}.muted{color:var(--mute)}.sp{margin-left:10px}
.wrap{max-width:640px;margin:0 auto;padding:14px var(--gr) 170px var(--gx)}
.h1{font:400 26px/1.3 "Dela Gothic One",sans-serif;margin:8px 0 12px}
.h2{font:700 16px/1.4 "Zen Kaku Gothic New";margin:0 0 8px}
.h3{font:700 13px/1.4 "IBM Plex Mono","Zen Kaku Gothic New";letter-spacing:.06em;color:var(--mute);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.card.note{border-left:4px solid var(--mark)}
.note{background:color-mix(in srgb,var(--mark) 22%,transparent);padding:8px 10px;border-radius:6px}
.gold-c{border-left:4px solid var(--gold)}
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:700;touch-action:manipulation}
.btn small{font-weight:400;font-size:11px;color:var(--mute)}
.btn.pri small{color:inherit;opacity:.85}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:52px;font-size:17px}.btn.sm{min-height:38px;padding:6px 10px;font-size:13px}
.btn.dis{opacity:.45}
.btn:active,.chip:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.rowbtn:focus-visible,.tabs button:focus-visible,.mcard:focus-visible,.wcard:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.row2,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{min-height:36px;padding:4px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;border:1px solid var(--line);font-size:11.5px}
.tag.up{border-color:var(--ok);color:var(--ok)}.tag.dn{border-color:var(--ng);color:var(--ng)}
.tag.gold{background:var(--gold);color:#fff;border-color:var(--gold)}.tag.gold-o{border-color:var(--gold);color:var(--gold)}
.chips.static{margin:4px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:40px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}.bar.warn i{background:var(--ng)}.bar.ok i{background:var(--ok)}
.skl{display:flex;align-items:center;gap:8px;margin:4px 0}.skl span{width:5.5em;font-size:13px}.skl em{width:5em;font-style:normal}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);padding:8px var(--gr) 8px var(--gx);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.top-l{display:flex;flex-direction:column}.co{font:400 15px "Dela Gothic One"}
.top-r{display:flex;flex-direction:column;align-items:flex-end}.money{font-weight:500}
.top-b{grid-column:1/3;display:flex;align-items:center;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}.pip.on{background:var(--mark)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:8px var(--gr) max(8px,env(safe-area-inset-bottom)) var(--gx);z-index:6}
.next{width:100%;margin-bottom:6px}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tabs button{border:0;background:none;padding:8px 0;font-size:11.5px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.wcard{display:flex;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;cursor:pointer}
.cover{width:64px;flex:none;height:auto;border-radius:3px;box-shadow:2px 3px 0 rgba(0,0,0,.18)}
.wc-b{display:flex;flex-direction:column;gap:2px;min-width:0}.wt{font-size:16px}
.wm-h{display:flex;gap:12px;margin:0 0 6px}.wm-h .cover{width:80px}
.clues{margin:4px 0 8px;padding-left:1.2em}.clues li{margin:2px 0}
.news{margin:0;padding-left:1.2em}.rank{margin:0;padding-left:1.4em}.rank li.mine b{background:linear-gradient(transparent 55%,var(--mark) 55%)}.rank li span{margin-left:8px}
.fld{display:block;margin:10px 0}.fld>span{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
input[type=text],input:not([type]),textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel)}
input[type=range]{width:100%}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.rowbtn{display:flex;flex-direction:column;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 6px;cursor:pointer}
.rowbtn.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}.rowbtn.dis{opacity:.55}
.cand-h{display:flex;gap:8px;align-items:center;justify-content:space-between}.cand-f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cand-f .mono{flex:1 0 100%}
.map{width:100%;height:auto;color:var(--ink)}.map .plot{cursor:pointer}
.spark{width:100%;height:50px}
.back{border:0;background:none;color:var(--accent);padding:8px 0;cursor:pointer;font-weight:700}
.title{padding-top:28px}.mast{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:6px;font-size:11px}
.logo{font:400 44px/1.15 "Dela Gothic One";margin:18px 0 8px;background:linear-gradient(transparent 62%,var(--mark) 62%);display:inline-block}
.lead{color:var(--mute)}.upd ul{margin:4px 0 8px;padding-left:1.2em}
.logl{list-style:none;padding:0;margin:0}.logl li{padding:4px 0;border-bottom:1px solid var(--line)}
#modal{display:none}#modal.on{display:block}
.veil{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;z-index:21;background:var(--paper);border-top:3px solid var(--ink);border-radius:14px 14px 0 0;padding:18px var(--gr) max(24px,env(safe-area-inset-bottom)) var(--gx);max-width:640px;margin:0 auto}
.x{position:absolute;top:8px;right:12px;border:0;background:none;font-size:28px;cursor:pointer;line-height:1;color:var(--mute)}
#cine{display:none}#cine.on{display:flex;position:fixed;inset:0;z-index:30;background:#0C0E14;color:#fff;align-items:center;justify-content:center;padding:24px var(--gr) 24px var(--gx);text-align:center}
#cine.gold{background:radial-gradient(circle at 50% 30%,#4a3a0a,#0C0E14 70%)}
#cine.t5{background:radial-gradient(circle at 50% 30%,#4a3a0a,#0C0E14 70%)}#cine.t1,#cine.t2{background:#13151b}
.cine-in{max-width:520px;width:100%}.cine-k{color:var(--mark);letter-spacing:.2em;margin:0}.cine-t{font:400 28px/1.3 "Dela Gothic One";margin:8px 0 18px}.cine-t.big{font-size:44px}
.cine-l{opacity:0;animation:fade .7s forwards;margin:6px 0}.cine-l.gold{color:var(--mark)}
.stamp{display:inline-block;margin:22px 0 10px;padding:6px 22px;border:4px solid var(--mark);color:var(--mark);font:400 34px "Dela Gothic One";transform:rotate(-6deg) scale(1.6);opacity:0;animation:stamp .5s forwards}
.stamp.t1,.stamp.t2{border-color:#8a90a0;color:#8a90a0}
.cine-b{opacity:0;animation:fade .6s forwards;margin-top:20px;min-width:180px}
.rise{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cf{position:fixed;top:-12px;width:8px;height:12px;border-radius:1px;opacity:.9;animation:fall 3.4s linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.nm{width:100%;margin:3px 0;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel)}
.chars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:end}.chars .btn{grid-column:1/4}
.dexc{display:flex;gap:12px}.dexc .cover{width:56px;align-self:flex-start}
.gold-c{background:linear-gradient(100deg,var(--panel) 60%,color-mix(in srgb,var(--gold) 18%,var(--panel)))}
@keyframes fade{to{opacity:1}}@keyframes stamp{to{opacity:1;transform:rotate(-6deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.rise,.spin,.cf{animation:none!important}.cf{display:none}.cine-l,.stamp,.cine-b{animation-duration:.01s!important;animation-delay:0s!important}.bar i{transition:none}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:700;text-align:center}
#toast.show{opacity:1}#toast.ng{background:var(--ng);color:#fff}
@media (max-width:420px){.logo{font-size:36px}.tabs button{font-size:10.5px}}

.tip{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:12.5px}
.tip span{flex:1}.tip button{border:0;background:none;font-size:20px;line-height:1;color:var(--mute);cursor:pointer;padding:0 2px}
.nextc{border-left:4px solid var(--accent)}.nextc p{margin:4px 0 8px}
.tgrid{display:grid;grid-template-columns:.8fr 1.5fr 1.2fr;gap:8px}.tgrid .btn{min-height:46px;font-size:12.5px;padding:6px 6px;white-space:nowrap}
.tnews{position:relative;width:100%}.newbadge{position:absolute;top:-6px;right:-4px;background:var(--ng);color:#fff;font:700 10px/1 "IBM Plex Mono";padding:3px 6px;border-radius:999px}
.continfo{margin:-4px 0 0;text-align:center}.ver{margin-top:6px}
.slotc.cur{border-color:var(--accent)}.slot-h{display:flex;justify-content:space-between;align-items:center}.slot-t{margin:4px 0}
.warn{color:var(--ng);font-weight:700}.btn.danger{border-color:var(--ng);color:var(--ng)}
.tabs-s{margin:6px 0 12px}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.news2 .nv{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--panel)}.news2 .nv.cur{border-left:4px solid var(--accent)}
.nv-h{display:flex;gap:8px;align-items:center}.news2 ul{margin:6px 0 0;padding-left:1.2em}.news2 summary{cursor:pointer}
.ach{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 6px;background:var(--panel);opacity:.6}.ach.on{opacity:1;border-left:4px solid var(--gold)}.ach p{margin:0}
.gd p{margin:8px 0}.gd-n{color:var(--mute);font-size:12px}.gd-dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.gd-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.gd-dots i.on{background:var(--accent)}
.scene{margin:0 auto 14px;max-width:340px}.scene-svg{width:100%;height:auto;display:block}
.tw{animation:tw 1.6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.steam path{animation:steam 2.4s ease-in-out infinite}@keyframes steam{0%,100%{opacity:.2}50%{opacity:.7}}
.plane{animation:fly 3.2s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,6px)}}
.balloon{animation:float 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.graph{width:100%;height:auto}.lg{display:inline-block;width:10px;height:3px;margin:0 4px 2px 8px;background:var(--accent)}.lg.b{background:var(--gold)}
.ms{list-style:none;padding:0;margin:6px 0}.ms li{padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}
.world{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.wd{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;display:flex;flex-direction:column;opacity:.6}.wd.on{opacity:1;border-color:var(--gold)}.wd em{font-style:normal;font-size:11px}
details.nv summary{list-style:none}
@media (prefers-reduced-motion:reduce){.tw,.steam path,.plane,.balloon{animation:none!important}}

/* v0.4.1 見た目と上部ナビ */
body{background:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--accent) 14%,transparent),transparent),var(--paper)}
.card{border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(20,30,80,.28)}
.h2{display:flex;align-items:center;gap:8px}.h2::before{content:"";width:5px;height:1em;border-radius:3px;background:linear-gradient(var(--accent),#8a5cf0)}
.btn.pri{background:linear-gradient(135deg,var(--accent),#6a3fd6);border-color:transparent;box-shadow:0 6px 14px -8px var(--accent)}
.btn{border-radius:12px}
.top2{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,#2446C8,#5b3fd0);color:#fff;padding:8px var(--gr) 0 var(--gx);box-shadow:0 8px 18px -10px rgba(20,20,80,.6)}
.t2a{display:flex;justify-content:space-between;align-items:center;gap:10px}.t2n{display:flex;flex-direction:column;min-width:0}.t2n .co{font:400 16px "Dela Gothic One";overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t2n .small{opacity:.85}
.next2{border:0;border-radius:999px;background:#FFE25A;color:#1b1b2b;font:700 15px "Zen Kaku Gothic New";padding:10px 18px;min-height:44px;box-shadow:0 4px 0 #c9a800;cursor:pointer;white-space:nowrap}.next2:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a800}
.t2b{display:flex;align-items:center;gap:10px;margin:6px 0 4px}.money2{font-size:19px;font-weight:500}.dl{font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.18)}.dl.dn{background:rgba(255,90,90,.35)}.dl.up{background:rgba(120,255,180,.25)}
.t2p{display:flex;gap:4px;margin-left:auto}.top2 .pip{border-color:#fff}.top2 .pip.on{background:#FFE25A;border-color:#FFE25A}.t2s{width:64px;flex:none}.top2 .bar{background:rgba(255,255,255,.28)}.top2 .bar i{background:#fff}.top2 .bar.warn i{background:#ff8c8c}
.tabs2{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -4px}
.tabs2 button{border:0;background:none;color:rgba(255,255,255,.75);padding:5px 0 6px;font:700 10.5px "Zen Kaku Gothic New";cursor:pointer;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px}
.tabs2 button i{font-style:normal;font-size:17px;line-height:1.1}.tabs2 button.on{background:var(--paper);color:var(--ink)}
.wrap.navtop{padding-bottom:56px;padding-top:12px}
body[data-nav=top] #toast{bottom:28px}
.hero{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:0 0 12px;background:var(--panel);box-shadow:0 10px 24px -14px rgba(20,30,80,.45)}
.sky{display:block;width:100%;height:auto}.cloud{animation:drift 26s linear infinite}.cloud.c2{animation-duration:38s;animation-delay:-12s}@keyframes drift{0%{transform:translateX(-30px)}100%{transform:translateX(60px)}}
.hero-b{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}.hero-t{font:400 17px "Dela Gothic One"}.hero-s{display:flex;gap:12px}.hero-s span{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--mute)}.hero-s b{font:500 16px "IBM Plex Mono";color:var(--ink)}
.shelf-w{margin:6px 0 12px}.shelf{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}

/* v0.5.0 行動のしくみ・整理・PCレイアウト */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.grid3 .btn{min-height:58px;padding:6px 4px;font-size:13.5px}.grid3 .btn small{font-size:10.5px;text-align:center}
.acts .h3{margin:12px 0 6px}.chip small{color:var(--mute);margin-left:2px}.chip.on small{color:inherit}
.slots{display:flex;flex-direction:column;gap:6px;margin:6px 0}.slot{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:44px;font-size:13px}.slot b{width:22px;height:22px;border-radius:50%;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font:500 12px "IBM Plex Mono";flex:none}.slot.on{border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}.slot.on b{background:var(--accent);color:#fff}.slot span{flex:1}.slot button{border:0;background:none;font-size:20px;color:var(--mute);cursor:pointer;min-width:32px;min-height:32px}
.pips-l{display:flex;gap:8px;margin:6px 0}.pip.big{width:22px;height:22px}
.t2r{margin-left:auto;display:flex;align-items:center;gap:6px}.t2lab{font-size:11px;opacity:.85}.t2r .t2p{margin-left:0}
.t2plan{border:0;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;font:700 12px "Zen Kaku Gothic New";padding:4px 10px;cursor:pointer;min-height:30px}

}
function unpackState(str) {

    var kind = str.charAt(0), u = b64ToU8(str.slice(1));
    if (kind === "P") return Promise.resolve(JSON.parse(new TextDecoder().decode(u)));
    if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("この環境では読み込めません"));
    var ds = new DecompressionStream("gzip"), w = ds.writable.getWriter(); w.write(u); w.close();
    return streamBytes(ds.readable).then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
  } catch (e) { return Promise.reject(e); }
}

function deepFill(t, d) {

    else if (d[k] && typeof d[k] === "object" && !Array.isArray(d[k]) && t[k] && typeof t[k] === "object" && !Array.isArray(t[k])) deepFill(t[k], d[k]);
  }

}

var CLOUD = { db: null, uid: null, ready: false, state: "off" };
function cloudInit() {
  var c = window.claude;

  return Promise.all([c.use("db"), c.use("user")]).then(function (r) {
    CLOUD.db = r[0]; var user = r[1];
    if (!CLOUD.db || !user) return false;
    return Promise.resolve(user.id()).then(function (id) {
      if (!id) return false;
      CLOUD.uid = id; CLOUD.ready = true; CLOUD.state = "on"; return true;
    });
  }).catch(function () { return false; });
}
function cloudDoc(i) { return CLOUD.db.doc("data/users/" + CLOUD.uid + "/slot" + i); }
function cloudPush(i, z, meta) {
  if (!CLOUD.ready) return Promise.resolve();
  return cloudDoc(i).set({ z: z, meta: meta, at: Date.now() }).then(function () { CLOUD.state = "on"; }).catch(function () { CLOUD.state = "err"; });
}
function cloudList() {
  if (!CLOUD.ready) return Promise.resolve([null, null, null]);

    return cloudDoc(i).get().then(function (s) { return s.exists ? s.data() : null; }).catch(function () { return null; });
  }));
}
function cloudPull(i) {

    try { localStorage.setItem(slotKey(i), d.z); localStorage.setItem(slotKey(i) + "_meta", JSON.stringify(d.meta)); } catch (e) {}
    return unpackState(d.z).then(migrate);

}

/* ===== 音(Web Audio で合成) ===== */
var AU = { moodName: "title", ctx: null, master: null, bgmGain: null, seGain: null, timer: null, step: 0, on: false, mood: "calm" };
function auInit() {
  if (AU.ctx) return;
  try {
    var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AU.ctx = new C(); AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.9; AU.master.connect(AU.ctx.destination);
    AU.bgmGain = AU.ctx.createGain(); AU.bgmGain.connect(AU.master);
    AU.seGain = AU.ctx.createGain(); AU.seGain.connect(AU.master);
    auVol();
  } catch (e) { AU.ctx = null; }
}
function auVol() { if (!AU.ctx) return; AU.bgmGain.gain.value = SET.bgm * 0.22; AU.seGain.gain.value = SET.se * 0.5; }
function auResume() { auInit(); if (AU.ctx && AU.ctx.state === "suspended") AU.ctx.resume(); }
function tone(freq, t0, dur, type, vol, dest) {
  var o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + 0.05);
}
function mf(n) { return 440 * Math.pow(2, (n - 69) / 12); }
var BGM_TAB = { title: "title", home: "calm", works: "bright", scout: "calm", media: "drama", park: "waltz", hall: "grand", menu: "calm" };
function bgmMood(name) {
  var key = BGM_TAB[name] || "calm"; if (AU.moodName === key) return;
  AU.moodName = key; AU.step = 0;
  if (AU.on) { clearInterval(AU.timer); AU.timer = setInterval(bgmStep, BGM_MOODS[key].tempo); }
}
function bgmStep() {
  if (!AU.ctx || !AU.on || SET.bgm <= 0) return;
  var m = BGM_MOODS[AU.moodName || "calm"], t = AU.ctx.currentTime + 0.05, s = AU.step++, bar = Math.floor(s / m.bar) % m.prog.length, chd = m.prog[bar];
  if (s % m.bar === 0) chd.forEach(function (n) { tone(mf(m.root + n - 12), t, m.bar * m.tempo / 1000 * 0.9, "triangle", 0.12, AU.bgmGain); });
  if (s % 2 === 0 || m.bar === 6) { var n2 = m.mel[Math.floor(s / (m.bar === 6 ? 1 : 2)) % m.mel.length] + chd[0]; if (rnd() < 0.8) tone(mf(m.root + 12 + n2), t, 0.9, m.wave, 0.1, AU.bgmGain); }
}
function bgmStart() {
  auResume(); if (!AU.ctx || AU.on) return; AU.on = true;
  AU.timer = setInterval(bgmStep, BGM_MOODS[AU.moodName || "calm"].tempo);
}
function bgmStop() { AU.on = false; if (AU.timer) { clearInterval(AU.timer); AU.timer = null; } }
function se(kind) {
  if (SET.se <= 0) return; auResume(); if (!AU.ctx) return;
  var t = AU.ctx.currentTime + 0.01, d = AU.seGain;
  switch (kind) {
    case "tap": tone(660, t, 0.08, "square", 0.15, d); break;
    case "ok": tone(660, t, 0.1, "triangle", 0.3, d); tone(880, t + 0.08, 0.14, "triangle", 0.3, d); break;
    case "ng": tone(200, t, 0.18, "sawtooth", 0.2, d); break;
    case "write": [0, 0.05, 0.1].forEach(function (x) { tone(1800 + ri(0, 400), t + x, 0.04, "square", 0.08, d); }); break;
    case "coin": tone(988, t, 0.08, "square", 0.2, d); tone(1319, t + 0.07, 0.2, "square", 0.2, d); break;
    case "fan": [523, 659, 784, 1047].forEach(function (f, i) { tone(f, t + i * 0.09, 0.5, "triangle", 0.3, d); }); break;
    case "hall": [392, 523, 659, 784, 1047].forEach(function (f, i) { tone(f, t + i * 0.16, 1.2, "triangle", 0.3, d); }); tone(196, t, 2.2, "sine", 0.3, d); break;
    case "flop": [440, 349, 262].forEach(function (f, i) { tone(f, t + i * 0.2, 0.5, "sawtooth", 0.15, d); }); break;
    case "page": tone(330, t, 0.06, "sine", 0.2, d); break;
  }
}

/* ===== 操作 ===== */
function applyRes(r) { if (!r) return; toast(r.msg, r.ok); se(r.ok ? "ok" : "ng"); }
function setPath(obj, path, v) { var a = path.split("."); var o = obj; for (var i = 0; i < a.length - 1; i++) o = o[a[i]]; o[a[a.length - 1]] = v; }
function refreshSlots() { G.slots = readSlots(); }
function enterGame(S, slot) { G.S = S; G.slot = slot; G.screen = "game"; G.tab = "home"; G.modal = []; G.cur = null; G.cine = null; bgmStart(); render(); pump(); }
function autosave() { if (G.slot && G.S) saveSlot(G.slot, G.S).then(function () { refreshSlots(); }); }

function act(a, el) {
  var d = el ? el.dataset : {}, S = G.S, r;
  if (a !== "noop") auResume();
  switch (a) {
    case "noop": return;
    case "newgame": G.form.ng.slot = (G.slots.findIndex(function (s) { return !s; }) + 1) || 1; G.screen = "new"; se("tap"); return render();
    case "totitle": G.screen = "title"; G.modal = []; refreshSlots(); return render();
    case "ng": G.form.ng[d.k] = d.k === "slot" ? +d.v : d.v; se("tap"); return render();
    case "start": var f = G.form.ng; var S0 = newGame({ name: f.name, company: f.company, diff: f.diff }); se("ok"); enterGame(S0, +f.slot); return autosave();
    case "tab": G.tab = d.t; G.fx = true; se("page"); window.scrollTo(0, 0); return render();
    case "hallt": G.hallTab = d.t; return render();
    case "close": G.modal.pop(); return render();
    case "slots": refreshSlots(); G.modal.push({ t: "slots", mode: d.mode }); if (CLOUD.ready) cloudList().then(function (l) { G.cloudSlots = l; render(); }); return render();
    case "settings": return pushModal({ t: "settings" });
    case "code": return pushModal({ t: "code" });
    case "log": return pushModal({ t: "log" });
    case "next":
      if (G.busy) return; se("page"); tick(S); autosave(); toast(dinfo(S.t).label, true); window.scrollTo(0, 0); G.cur = null; return pump();
    case "curnext": S.queue.shift(); G.cur = null; G.curRes = null; return pump();
    case "choose": G.curRes = resolveEv(S, G.cur, +d.i) || "…"; se("ok"); return render();
    case "cinenext": S.queue.shift(); G.cine = null; return pump();
    case "work": G.form.rn = ["", "", ""]; return pushModal({ t: "work", wid: d.id, clues: workClues(S, W(S, d.id)) });
    case "rest": r = actRest(S); break;
    case "job": r = actJob(S); if (r.ok) se("coin"); break;
    case "practice": r = actPractice(S); if (r.ok) se("write"); break;
    case "slush": r = actSlush(S); break;
    case "network": r = actNetwork(S); break;
    case "study": r = actStudy(S, d.k); break;
    case "train": r = actTrain(S); break;
    case "openoffice": r = actOpenOffice(S); break;
    case "takepen": r = actTakePen(S); break;
    case "plan": G.form.plan.title = G.form.plan.title || mkTitle(); if (!G.form.plan.chars.some(function (x) { return x; })) G.form.plan.chars = genChars().map(function (c) { return c.name; }); return pushModal({ t: "plan" });
    case "randchars": G.form.plan.chars = genChars().map(function (c) { return c.name; }); return render();
    case "rename": r = actRename(S, d.id, G.form.rn); G.form.rn = ["", "", ""]; break;
    case "dex": return pushModal({ t: "dex" });
    case "parkevent": r = actParkEvent(S); break;
    case "randtitle": G.form.plan.title = mkTitle(); return render();
    case "pf": G.form.plan[d.k] = d.v; if (d.k === "medium") S.flags.illList = null; se("tap"); return render();
    case "doplan": r = actPlan(S, G.form.plan); if (r.ok) { G.modal = []; G.form.plan.title = ""; G.form.plan.illusId = ""; G.tab = "works"; } break;
    case "write": r = actWrite(S, d.id, d.s); if (r.ok) se("write"); break;
    case "meet": r = actMeet(S, d.id, d.d); break;
    case "promo": r = actPromo(S, d.id, +d.l); break;
    case "reprint": r = actReprint(S, d.id, +d.l); if (r.ok) se("coin"); break;
    case "contest": r = actContest(S, d.id); break;
    case "reroute": r = actReroute(S, d.id); break;
    case "sequel": r = actSequel(S, d.id); break;
    case "end": r = actEnd(S, d.id); break;
    case "assign": r = actAssign(S, d.id, d.e); break;
    case "scout": r = actScout(S, d.kind); break;
    case "sign": r = actSign(S, d.id); break;
    case "pass": r = actPass(S, d.id); break;
    case "hire": r = actHire(S, d.id); break;
    case "fire": r = actFire(S, d.id); break;
    case "offer-yes": r = actOfferYes(S, d.id); break;
    case "offer-no": r = actOfferNo(S, d.id); break;
    case "offer-neg": r = actOfferNeg(S, d.id); break;
    case "mstart": G.form.m = { type: d.t, wid: "", mode: "partner", pid: partners(S, d.t)[0].id, budget: 1, fid: 1 }; return pushModal({ t: "media" });
    case "mpick":
      if (el.dataset.no) { toast(el.dataset.no, false); return se("ng"); }
      var fm = G.form.m;
      if (d.k === "partner") { fm.mode = "partner"; fm.pid = d.v; } else if (d.k === "mode") fm.mode = "inhouse"; else fm[d.k] = d.k === "wid" ? d.v : +d.v;
      se("tap"); return render();
    case "mgo":
      var fm2 = G.form.m; if (!fm2.wid) { toast("作品を選んでください", false); return se("ng"); }
      var pt = fm2.mode === "partner" ? partners(S, fm2.type).find(function (p) { return p.id === fm2.pid; }) : null;
      r = startMedia(S, { wid: fm2.wid, type: fm2.type, partner: pt, inhouse: fm2.mode === "inhouse", budget: fm2.budget, fid: fm2.fid });
      if (r.ok) { G.modal = []; } break;
    case "parkbuild": if (S.park.areas.length >= 9) return; return pushModal({ t: "parkpick" });
    case "parkgo": if (el.dataset.no) { toast(el.dataset.no, false); return se("ng"); } r = actParkBuild(S, d.id); if (r.ok) G.modal = []; break;
    case "parkup": r = actParkUp(S, d.id, d.fac); break;
    case "parkmode": r = actParkMode(S, d.m); break;
    case "parkpol": r = actParkPolicy(S, d.p); break;
    case "doslot":
      if (d.m === "save") { saveSlot(+d.i, S).then(function (x) { refreshSlots(); toast(x.msg, x.ok); se(x.ok ? "ok" : "ng"); render(); }); return; }
      loadSlot(+d.i).then(function (S2) { G.modal = []; enterGame(S2, +d.i); toast("ロードしました", true); }).catch(function (e) { toast(e.message, false); });
      return;
    case "delslot": deleteSlot(+d.i); refreshSlots(); return render();
    case "cloudpull": cloudPull(+d.i).then(function (S2) { refreshSlots(); G.modal = []; enterGame(S2, +d.i); toast("クラウドから読み込みました", true); }).catch(function (e) { toast(e.message, false); }); return;
    case "mkcode": exportCode(S).then(function (c) { G.form.code = c; render(); }); return;
    case "copycode":
      var txt = G.form.code; if (!txt) { toast("先にコードを作ってください", false); return; }
      var fb = function () { toast("コードを選択しました。手動でコピーしてください", true); var ta = document.querySelector("textarea"); if (ta) { ta.focus(); ta.select(); } };
      try { navigator.clipboard.writeText(txt).then(function () { toast("コピーしました", true); }, fb); } catch (e) { fb(); }
      return;

      importCode(G.form.code).then(function (S2) { G.modal = []; var sl = G.slot || ((G.slots.findIndex(function (s) { return !s; }) + 1) || 1); enterGame(S2, sl); autosave(); toast("引き継ぎました(スロット" + sl + ")", true); }).catch(function (e) { toast(e.message, false); se("ng"); });
      return;
    default: return;
  }
  applyRes(r); pump();
  var top = G.modal[G.modal.length - 1];
  if (top && top.t === "work") { var w = W(S, top.wid); if (w) top.clues = top.clues || workClues(S, w); }
}

/* ===== 入力・クリック ===== */
function bindEvents() {
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    if (el.classList.contains("dis") && !el.dataset.no) { se("ng"); return; }
    if (!AU.on && SET.bgm > 0) bgmStart();
    act(el.dataset.act, el);
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.in) { setPath(G.form, t.dataset.in, t.value); return; }
    if (t.dataset.rng) { SET[t.dataset.rng] = +t.value; saveSettings(); applyBright(); auVol(); if (t.dataset.rng === "bgm") { if (SET.bgm > 0) bgmStart(); } }
  });
